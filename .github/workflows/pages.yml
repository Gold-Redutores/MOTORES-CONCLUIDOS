name: Publicar site no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install pandas openpyxl "qrcode[pil]"

      - name: Gerar páginas HTML e QR Codes
        run: python gerar_site.py

      - name: Montar pasta de publicação
        run: |
          mkdir site
          cp index.html site/
          cp -R clientes equipamentos site/
          if [ -d Ativos ]; then
            cp -R Ativos site/
          elif [ -d assets ]; then
            cp -R assets site/
          else
            echo "Pasta de ativos Ativos/ ou assets/ não encontrada." >&2
            exit 1
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
